name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
        ruby: ["3.3", "3.4"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rails_vis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Test (SQLite)
        if: matrix.db == 'sqlite'
        run: bundle exec rake test
      - name: Test (PostgreSQL)
        if: matrix.db == 'postgres'
        env:
          RAILS_VIS_DB: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rails_vis_test
        run: bundle exec rake test
